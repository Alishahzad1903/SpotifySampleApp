<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Song Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div id="app">
      <header>
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="12" fill="#1DB954"/>
            <path d="M16.5 15.5c-.2 0-.3-.1-.5-.2-2-1.2-4.5-1.5-7.4-.8-.3.1-.5-.1-.6-.4-.1-.3.1-.5.4-.6 3.2-.7 6-.4 8.2 1 .2.1.3.4.2.6-.1.2-.2.4-.3.4zm1.2-2.5c-.2 0-.4-.1-.5-.2-2.3-1.4-5.8-1.8-8.5-1-.3.1-.6-.1-.7-.4-.1-.3.1-.6.4-.7 3.1-.9 6.9-.5 9.5 1.1.3.2.3.5.2.8-.1.2-.3.4-.4.4zm.1-2.6c-2.7-1.6-7.2-1.8-9.8-.9-.3.1-.7-.1-.8-.4-.1-.4.1-.7.4-.8 3-1 7.9-.8 11 1.1.3.2.4.6.2.9-.2.2-.5.3-.7.2-.1-.1-.2-.1-.3-.1z" fill="white"/>
          </svg>
          <span>Song Quiz</span>
        </div>
        <p class="subtitle">Listen to the clip. Guess the track.</p>
      </header>

      <div id="loading" class="screen active">
        <div class="loading-content">
          <div class="spinner"></div>
          <p>Loading today's quiz...</p>
        </div>
      </div>

      <div id="quiz" class="screen">
        <div class="card">
          <div class="progress">
            <div class="progress-pills">
              <span class="pill" data-round="0"></span>
              <span class="pill" data-round="1"></span>
              <span class="pill" data-round="2"></span>
              <span class="pill" data-round="3"></span>
              <span class="pill" data-round="4"></span>
            </div>
            <div class="score-area">
              <span id="streak-badge" class="streak-badge hidden">🔥 0</span>
              <span id="score-label" class="score-badge">0 pts</span>
            </div>
          </div>

          <div class="player-section">
            <div id="album-art-container" class="album-art-container">
              <img id="album-art" class="album-art" src="" alt="" />
              <div class="album-art-overlay">
                <button id="play-btn" class="play-btn" aria-label="Play clip">
                  <svg class="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                  </svg>
                  <svg class="pause-icon hidden" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
                  </svg>
                </button>
              </div>
            </div>
            <div id="timer-bar" class="timer-bar"><div class="timer-fill"></div></div>
            <p class="player-hint" id="player-hint">Tap to play a 3-second clip</p>
          </div>

          <div class="answer-timer-wrap">
            <div id="answer-timer" class="answer-timer"><div class="answer-timer-fill"></div></div>
            <span id="answer-time-label" class="answer-time-label"></span>
          </div>

          <div id="options" class="options"></div>

          <div id="feedback" class="feedback"></div>
          <div id="points-popup" class="points-popup hidden"></div>

          <button id="next-btn" class="next-btn hidden">
            Next Round
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          </button>
        </div>
      </div>

      <div id="results" class="screen">
        <div class="card results-card">
          <div id="confetti" class="confetti"></div>
          <div class="results-emoji" id="results-emoji">🎉</div>
          <h2 id="results-title">Quiz Complete!</h2>
          <p id="final-score" class="final-score"></p>
          <div class="results-stats" id="results-stats"></div>
          <div id="answers-summary" class="answers-summary"></div>
          <button id="replay-btn" class="btn-primary">Come Back Tomorrow</button>
        </div>
      </div>

      <div id="error" class="screen">
        <div class="card error-card">
          <div class="error-icon">⚠️</div>
          <p id="error-msg">Something went wrong. Please try again later.</p>
          <button onclick="location.reload()" class="btn-primary">Retry</button>
        </div>
      </div>

      <footer class="built-with">
        <span>⚡ Built in 10 minutes with</span>
        <a href="https://www.apimatic.io/product/contextmatic" target="_blank" rel="noopener">Context-matic</a>
        <span>by</span>
        <a href="https://www.apimatic.io" target="_blank" rel="noopener">APIMatic</a>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
